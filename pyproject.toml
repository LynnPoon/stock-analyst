[project]
name = "stock_analyst"
version = "0.1.0"
description = "stock-analyst using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.11.1",
    "yfinance>=1.2.0",
]

[project.scripts]
stock_analyst = "stock_analyst.main:run"
run_crew = "stock_analyst.main:run"
train = "stock_analyst.main:train"
replay = "stock_analyst.main:replay"
test = "stock_analyst.main:test"
run_with_trigger = "stock_analyst.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
